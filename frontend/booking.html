<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rajyog Mangal Karyalay – Book Your Date</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <div class="site-nav__wrapper">
        <a class="site-nav__brand" href="index.html">
          Rajyog Mangal Karyalay
        </a>
        <ul class="site-nav__links">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="booking.html">Book Now</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </nav>
    <header>
      <h1>Rajyog Mangal Karyalay</h1>
      <p>Book Your Date</p>
    </header>

    <main>
      <section class="form-card" aria-labelledby="booking-title">
        <h2 id="booking-title">Wedding Hall Booking Form</h2>
        <p class="form-card__intro">
          Please share your event details below. We will confirm availability
          and get back to you shortly.
        </p>

        <form id="booking-form" autocomplete="on" novalidate>
          <fieldset class="form-group">
            <legend class="form-group__title">Contact Information</legend>
            <div class="form-field">
              <label for="fullName">Full Name</label>
              <input
                type="text"
                id="fullName"
                name="name"
                placeholder="Enter your full name"
                required
                minlength="2"
                maxlength="100"
              />
            </div>

            <div class="form-field">
              <label for="phone">Phone Number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
                minlength="7"
                maxlength="20"
                inputmode="tel"
              />
            </div>
          </fieldset>

          <fieldset class="form-group">
            <legend class="form-group__title">Event Details</legend>
            <div class="form-field">
              <label for="eventDate">Event Date</label>
              <input type="date" id="eventDate" name="eventDate" required />
              <div
                class="date-status"
                id="date-status"
                aria-live="polite"
              ></div>
            </div>

            <div class="form-field">
              <label for="eventType">Event Type</label>
              <select id="eventType" name="eventType" required>
                <option value="" disabled selected>Select event type</option>
                <option value="wedding">Wedding</option>
                <option value="reception">Reception</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-field">
              <label for="guestCount">Guest Count</label>
              <input
                type="number"
                id="guestCount"
                name="guestCount"
                placeholder="Estimated guests"
                required
                min="1"
                max="10000"
              />
            </div>
          </fieldset>

          <div class="form-actions">
            <button type="submit">Submit Booking</button>
          </div>
        </form>

        <div
          class="form-messages"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </section>
    </main>

    <footer>
      <p>Rajyog Mangal Karyalay</p>
    </footer>

    <script src="js/booking.js"></script>
  </body>
</html>
