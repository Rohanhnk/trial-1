<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="admin-auth">
    <main class="auth">
      <section class="auth-card" aria-labelledby="admin-login-title">
        <header class="auth-card__header">
          <h1 id="admin-login-title" class="auth-card__title">Admin Login</h1>
          <p class="auth-card__subtitle">
            Access the booking management dashboard.
          </p>
        </header>

        <form
          class="auth-form"
          id="admin-login-form"
          autocomplete="on"
          novalidate
        >
          <div class="auth-field">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              required
              minlength="3"
            />
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              minlength="6"
            />
          </div>

          <button type="submit" class="auth-button">Log In</button>
        </form>

        <p class="auth-message" id="admin-login-message" role="status"></p>
      </section>
    </main>

    <script src="js/admin_login.js"></script>
  </body>
</html>
